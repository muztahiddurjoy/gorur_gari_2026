; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; NOTE: the registry's "espressif32" platform (6.x/7.x) ships Arduino core
; 2.0.17, not 3.x. The firmware is written to compile on both (the few API
; differences are guarded with ESP_ARDUINO_VERSION_MAJOR). For core 3.x, swap
; this line for a pinned pioarduino release, e.g.
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; (pioarduino patches the PlatformIO core in ~/.platformio/penv on first use).
platform = espressif32
; ESP32-S3-DevKitC-1 N16R8. The generic board definition is fine: the firmware
; never enables PSRAM (BOARD_HAS_PSRAM is not set), and only uses 8 of the 16 MB
; of flash. The octal PSRAM still owns GPIO35-37, so none of those appear in pins.h.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed=115200

; chain+ evaluates the #ifdef around the rc_car include, so the default
; env never pulls the library in at all
lib_ldf_mode = chain+

lib_deps =
    madhephaestus/ESP32Servo@^3.2.1
    okalachev/MAVLink@^2.0.31
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO
    ; BOTGyro IMU driver (MIT, depends only on Wire). Pinned to the commit its
    ; API was checked against (lib/heading uses it): src/ changed after the
    ; 2.0.0 tag while still calling itself 2.0.0, so the tag is not enough.
    ; PlatformIO builds it from its library.properties (no library.json needed).
    https://github.com/NOXUSTIC/BOTGyro.git#749c0a5db81152dad4acb727f8808ee4d23240bb

build_flags =
    -I include
    -I .pio/libdeps/$PIOENV/MAVLink/common
    ; The Pi link: a USB cable into the devkit's port labelled "USB" (the S3's
    ; own USB-Serial/JTAG controller, VID 303a -> /dev/gorur_mcu on the Pi),
    ; NOT the "UART"/"COM" port. USB_MODE=1 selects that controller (HWCDC)
    ; and CDC_ON_BOOT=1 makes it `Serial`, which is MAV_SERIAL in config.h.
    ; It carries MAVLink ONLY.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Human readable debug text shares that port, so it is compiled out unless
    ; DEBUG_PRINTS=1 (include/debug_serial.h). Only for bench tests WITHOUT the
    ; Pi, with a serial monitor on the USB port instead of mcu_bridge:
    ;   pio run -t upload  with  PLATFORMIO_BUILD_FLAGS="-D DEBUG_PRINTS=1"
    ; keep the core's own log output off too: with a sensor unplugged the I2C
    ; HAL would print an error line for every failed transaction.
    -D CORE_DEBUG_LEVEL=0

; the real firmware
[env:esp32-s3-devkitc-1]


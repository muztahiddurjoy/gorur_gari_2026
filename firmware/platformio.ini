; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
; NOTE: the registry's "espressif32" platform (6.x/7.x) ships Arduino core
; 2.0.17, not 3.x. The firmware is written to compile on both (the few API
; differences are guarded with ESP_ARDUINO_VERSION_MAJOR). For core 3.x, swap
; this line for a pinned pioarduino release, e.g.
;   platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
; (pioarduino patches the PlatformIO core in ~/.platformio/penv on first use).
platform = espressif32
; ESP32-S3-DevKitC-1 N16R8. The generic board definition is fine: the firmware
; never enables PSRAM (BOARD_HAS_PSRAM is not set), and only uses 8 of the 16 MB
; of flash. The octal PSRAM still owns GPIO35-37, so none of those appear in pins.h.
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed=115200

; chain+ evaluates the #ifdef around the rc_car include, so the default
; env never pulls the library in at all
lib_ldf_mode = chain+

lib_deps =
    madhephaestus/ESP32Servo@^3.2.1
    okalachev/MAVLink@^2.0.31
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BNO055
    adafruit/Adafruit BusIO

build_flags =
    -I include
    -I .pio/libdeps/$PIOENV/MAVLink/common
    ; Serial = the devkit's native USB port (303a:1001), used for human
    ; readable debug logs only (see include/debug_serial.h). The Pi is NOT on
    ; USB any more: MAVLink runs over Serial1, the UART on GPIO40/41, to the
    ; Pi's /dev/ttyAMA0 (see setup() in src/main.cpp).
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; keep the core's own log output off. It can no longer corrupt the MAVLink
    ; link (that is Serial1), but with a sensor unplugged the I2C HAL would
    ; print an error line for every failed transaction and bury our own logs.
    -D CORE_DEBUG_LEVEL=0

; the real firmware
[env:esp32-s3-devkitc-1]


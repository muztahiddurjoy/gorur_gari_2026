; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed=115200

; chain+ evaluates the #ifdef around the rc_car include, so the default
; env never pulls the library in at all
lib_ldf_mode = chain+

lib_deps =
    madhephaestus/ESP32Servo
    okalachev/MAVLink@^2.0.31
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BNO055
    adafruit/Adafruit BusIO

build_flags =
    -I include
    -I .pio/libdeps/$PIOENV/MAVLink/common
    ; keeps Serial = native USB CDC (ttyACM0, 303a:1001) and Serial0 = UART0 on
    ; GPIO43/44. mcu_bridge.py no longer opens ACM0 - the MAVLink link moved to
    ; UART1 and a USB-to-TTL adapter (see include/mav_serial.h) - but the split
    ; is still what DEBUG_SERIAL keys off, and it keeps the CDC port a harmless
    ; place for a stray print rather than a third thing sharing UART0.
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; the arduino hal logs i2c errors straight to Serial. that is no longer the
    ; port the mavlink frames go out on, so a stray "[E][Wire.cpp:499] ..." can
    ; no longer desync the ROS2 parser - but a brownout on the i2c bus would
    ; still have the hal printing from inside the i2c task at whatever rate the
    ; failure repeats, which is its own kind of trouble. keep it quiet; firmware
    ; logs of our own go to DEBUG_SERIAL (see debug_serial.h).
    -D CORE_DEBUG_LEVEL=0

; the real firmware
[env:esp32-s3-devkitc-1]


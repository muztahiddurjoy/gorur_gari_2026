; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed=115200

; chain+ evaluates the #ifdef around the rc_car include, so the default
; env never pulls the library in at all
lib_ldf_mode = chain+

lib_deps =
    madhephaestus/ESP32Servo
    okalachev/MAVLink@^2.0.31

build_flags =
    -I include
    -I .pio/libdeps/$PIOENV/MAVLink/common
    ; the devkit's native USB port enumerates as /dev/ttyACM0 (303a:1001), which is
    ; what mcu_bridge.py opens. without this, Serial is UART0 on GPIO43/44 and only
    ; reaches the *other* (CH343) socket, so nothing shows up on ACM0.
    ; with this set, Serial = native USB CDC and Serial0 = UART0.
    -D ARDUINO_USB_CDC_ON_BOOT=1

; the real firmware
[env:esp32-s3-devkitc-1]


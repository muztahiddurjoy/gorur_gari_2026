# ════════════════════════════════════════════════════════════════════
# What the virtual ESP32 needs that neither the firmware nor the CAD fixes.
# Geometry comes from cad_geometry.yaml; the driving stack's own tuning comes
# from the REAL ros2_ws/config/*.yaml files, loaded directly (config/ here has
# symlinks to them). Only hardware constants belong in this file.
# ════════════════════════════════════════════════════════════════════

sim_mcu:
  ros__parameters:
    # The pty mcu_bridge opens instead of the real /dev/gorur_mcu. See sim_overlay.yaml.
    port_link: /tmp/gorusim_esp32

    # Encoder ticks per turn of the wheel. Taken from the calibration the car
    # actually runs with: the launch files give vector_odom 400 ticks, a
    # 0.057 m wheel and a distance scale of 1.0. That is one fixed distance per
    # tick, 0.4477 mm. Around the CAD's 53 mm tyre:
    #   400 * 0.053 / (0.057 * 1.0) = 371.93 ticks
    # so vector_odom reads true distance in the sim, exactly as it is calibrated to.
    encoder_counts_per_wheel_rev: 371.93

    # At full duty on a 3S pack. Must match motor_no_load_speed in
    # description/control.xacro: see there for the working and the caveat.
    motor_no_load_speed_rad_s: 98.3

    # Below this a stopped axle stays stopped: gearbox stiction, 15% duty = wire 38.
    # Typical, not measured. See the note in description/control.xacro.
    motor_breakaway_duty: 0.15

    # MG996R datasheet: 0.17 s per 60 deg at 4.8 V, on the 5 V rail.
    servo_slew_deg_per_s: 353.0

    # Tyres touch the chassis here: tools/steering_lock.py. Must match
    # steer_stop_inner / steer_stop_outer in description/goruBot.xacro.
    inner_stop_deg: 39.0
    outer_stop_deg: 31.0

    # > 0 presses the start button by itself this many seconds after boot.
    auto_start_sec: 0.0

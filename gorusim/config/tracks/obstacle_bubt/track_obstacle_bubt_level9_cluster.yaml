# ════════════════════════════════════════════════════════════════════
# Level 9: Asymmetric Cluster / False Dead-End
#
# Corridor: 3.0 m x 1.0 m (x: [0, 3], y: [-0.5, 0.5])
# Start: x = 0.30 m, Finish: x = 2.70 m
# Characteristics:
#   - Heavy 3-pillar cluster in the middle section (x in [1.15, 1.65]):
#     Three pillars packed irregularly (x=1.20 y=-0.12, x=1.35 y=0.18, x=1.58 y=-0.18).
#   - Creates an optical illusion of a dead end from afar until the disparity
#     extender gets within 1 m and discovers the serpentine opening.
#   - Tests recovery from high steering angles without side-wall spinout.
# ════════════════════════════════════════════════════════════════════

objects: true

start:
    nose_offset_m: 0.1205
    pos:
        x: 0.30
        y: 0.0
    angle: 0

parking:
    enabled: false

towers:
    -   color: "Plain"
        pos: { x: 0.75, y: 0.15 }   # Intro obstacle
    -   color: "Plain"
        pos: { x: 1.15, y: -0.15 }  # Cluster pillar 1
    -   color: "Plain"
        pos: { x: 1.35, y: 0.18 }   # Cluster pillar 2
    -   color: "Plain"
        pos: { x: 1.62, y: -0.18 }  # Cluster pillar 3
    -   color: "Plain"
        pos: { x: 2.05, y: 0.10 }   # Center-skewed exit
    -   color: "Plain"
        pos: { x: 2.38, y: -0.22 }  # Final offset gate

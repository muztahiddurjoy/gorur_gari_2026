# ════════════════════════════════════════════════════════════════════
# Global bot configuration — the single source of truth for the
# physical robot.
#
# The `/**` section matches EVERY node launched with this file, so any
# node that declares `bot.*` parameters picks the same geometry up.
# Node-specific tuning lives under the node's own name below.
#
# Use it standalone:
#   ros2 run autonomy custom_disparity_extender --ros-args \
#       --params-file config/bot_config.yaml
# or from a launch file:
#   parameters=[os.path.join(WORKSPACE_DIR, 'config', 'bot_config.yaml')]
# ════════════════════════════════════════════════════════════════════

/**:
  ros__parameters:
    bot:
      width_m: 0.12              # chassis width including wheels
      length_m: 0.21             # bumper to bumper
      wheel_diameter_m: 0.050    # drive wheel diameter
      encoder_counts_per_rev: 185
      max_steer_deg: 180.0        # physical steering lock (one side)
      safety_margin_m: 0.01      # clearance kept on EACH side of the bot
      max_speed_mps: 0.8         # cruise ceiling on open track
      min_speed_mps: 0.5        # creep floor while threading gaps
      lidar:
        frame_id: laser          # must match the C1 driver's frame_id
        forward_offset_m: 0.0    # lidar origin ahead(+)/behind(-) of bot centre
        yaw_deg: 0.0             # lidar 0-deg ray relative to bot-forward;
                                 # set 180.0 for a cable-forward mount
      tower:
        width_m: 0.05            # pillar face width (50 mm)
        min_separation_m: 0.15   # closest possible pillar centre-to-centre gap

mcu_bridge:
  ros__parameters:
    # ── Serial link to the ESP32-S3 ───────────────────────────────
    port: /dev/esp32_s3          # udev alias for the native USB CDC port
    baudrate: 115200

    # ── /cmd_vel -> wire command scaling ──────────────────────────
    # The firmware applies whatever throttle/steering arrives on the
    # wire (firmware/src/main.cpp), so these are THE drive limits —
    # there is no second clamp on the MCU.
    throttle_scale: 100.0        # wire throttle = linear.x * this
    throttle_min: -128           # int8 wire field floor (full reverse)
    throttle_max: 127            # int8 wire field ceiling (full forward)
    steering_center_deg: 90      # servo angle that rolls straight
    steering_gain_deg: 60.0      # wire angle = center + angular.z * this
    steering_min_deg: 0          # servo clamp, full left
    steering_max_deg: 180        # servo clamp, full right

    # ── Launch boost (kick to break static friction) ──────────────
    launch_boost_gain: 2.0       # multiplier on the command that starts a move
    launch_boost_duration: 1.0   # seconds the kick stays live
    launch_idle_timeout: 0.5     # cmd_vel silence that counts as stopped

open_round_run:
  ros__parameters:
    # Master switch: the node never publishes /cmd_vel unless this is
    # true. The in-code default is false, so a bare `ros2 run` without
    # this file can never move the car.
    enable_auto_steering: true

    # ── Round ─────────────────────────────────────────────────────
    target_laps: 3
    # Lap-complete signals within this many seconds of GO are stale
    # counts from a previous run and are ignored.
    min_run_time_sec: 5.0

    # ── Speed ─────────────────────────────────────────────────────
    # The published throttle is drive_speed (below, in the encoder
    # stall block) times the stall boost, times turn_speed_gain while
    # turning. The old corner speed cap and open-distance multiplier
    # that used to LOWER the command in turns are removed. max_speed
    # only scales the dynamic cast radius now.
    max_speed: 0.69

    # ── Corner throttle ───────────────────────────────────────────
    # Steering load slows the drivetrain, so turning gets MORE linear
    # speed, not less.
    turn_speed_gain: 1.25        # linear.x multiplier while turning
    turn_steer_thresh: 0.15      # |angular.z| that counts as turning

    # ── Wall hugging ──────────────────────────────────────────────
    wall_hug_enable: true
    wall_target_dist_m: 0.35     # held off the outer wall on straights
    wall_side: auto              # auto latches from lap direction; or left/right
    wall_kp_deg_per_m: 40.0      # heading trim per metre of wall error
    wall_max_correction_deg: 12.0
    wall_hug_gate_deg: 25.0      # trim only while target is this straight
    wall_valid_max_dist_m: 1.2   # farther side readings are openings, not wall

    # ── Return to start (after the laps) ──────────────────────────
    odom_units: cm               # MUST match vector_odom's output_units
    home_radius_m: 0.05          # park within 5 cm of the start point
    homing_max_speed: 0.30
    homing_min_speed: 0.25       # creep floor while closing in
    homing_slowdown_dist_m: 0.60
    homing_timeout_sec: 45.0
    max_gear_flips: 6            # anti-hunting: settle after this many reversals

    # ── Heading convention (must match vector_odom) ───────────────
    # The BNO055 heading grows CLOCKWISE (compass style) and boots at
    # 0.0; vector_odom is launched with heading_clockwise=true. This
    # MUST be true as well or this node's yaw is sign-flipped against
    # the odometry frame: the auto wall latch hugs the INNER wall, the
    # fused steering turns the wrong way, and homing steers backwards.
    heading_clockwise: true
    heading_offset_deg: 0.0

    # ── Heading-fused steering ────────────────────────────────────
    # The LiDAR target is latched as an absolute compass heading and
    # the 40 Hz loop steers on the live /heading error (PD), so the
    # car tracks its own rotation instead of open-looping the servo.
    # Gains proven by sensors_processing SteeringStabilizer /
    # box_lap_test on this chassis.
    heading_fusion_enable: true
    heading_kp: 0.03             # steer per degree of heading error
    heading_kd: 0.005            # damping against error swing
    # 1.5 is FULL servo travel: the bridge maps servo = 90 + z*60, so
    # z = ±1.5 reaches 0/180. Steering is deliberately unlimited.
    heading_max_steer: 1.5
    heading_deadband_deg: 2.0    # BNO jitter suppression on straights
    heading_stale_sec: 0.5       # /heading older -> raw LiDAR steering

    # ── Encoder stall adaptation ──────────────────────────────────
    # /encoder/count fused as a wheels-actually-turning sense: while a
    # drive command is out but the tick count is frozen, the throttle
    # ramps up GENTLY (never a slam) until the wheels move, then eases
    # back. Peak throttle = drive_speed * stall_boost_max = 1.10.
    drive_speed: 1.25           # nominal linear.x while lapping — THE linear limit
    max_steer_cmd: 1.5           # steering unlimited: full 0-180 servo travel
    stall_timeout_sec: 0.2       # frozen ticks this long while driving = stalled
    stall_boost_step: 0.2        # boost ramp per second (up and down)
    stall_boost_max: 10.0         # boost ceiling ("not too much")
    encoder_stale_sec: 1.0       # dead /encoder/count -> boost disabled

run_timer:
  ros__parameters:
    # The run stopwatch. It measures and displays, it never drives, so none
    # of this can affect how the car behaves.
    #
    # The state machine to follow. open_round_run publishes this once a
    # second and again the moment it changes state.
    state_topic: /open_round/state
    start_states: ["RUNNING"]    # the clock starts here...
    stop_states: ["FINISHED"]    # ...and freezes here, after homing has parked
    reset_states: ["STANDBY"]    # a driving node restarting re-arms it
    # Anything not listed above (ARMING, HOMING) leaves the clock alone,
    # which is why homing counts towards the run time.

    publish_rate_hz: 10.0        # one update per displayed tenth of a second
    log_period_sec: 5.0          # progress lines while running, 0 for none
    # Silence on state_topic this long with the clock running means the
    # driving node is gone. Freeze at the last state message rather than
    # count up forever. 0 disables the check.
    state_timeout_sec: 5.0

custom_disparity_extender:
  ros__parameters:
    # Master switch: the node never publishes /cmd_vel unless this is
    # true. The in-code default is false, so a bare `ros2 run` without
    # this file can never move the car.
    enable_drive: true

    scan_topic: /scan
    cmd_vel_topic: /cmd_vel

    # ── Edge detection (tower finder) ─────────────────────────────
    spike_threshold_m: 0.02      # disparity at spike_ref_dist_m
    spike_ref_dist_m: 0.05        # threshold scales linearly beyond this
    edge_stride: 3               # compare ranges[i] vs ranges[i-stride]
    detect_fov_half_deg: 90.0    # half-angle searched for towers
    width_min_cm: 3.0            # coarse segment floor (1 ray of noise)
    width_max_cm: 25.0           # coarse ceiling (200 mm parking wall + slack)
    max_useful_range_m: 2.0      # beyond this a 5 cm pillar is <= 2 rays

    # ── Navigation (disparity extender) ───────────────────────────
    nav:
      fov_half_deg: 80.0         # steering search half-angle
      max_range_m: 3.0           # scan cap; no-return rays count as this
      disparity_threshold_m: 0.25 # min neighbour step that is an edge
      stop_distance_m: 0.15      # blocked stop-cone trigger (bot is 31 cm long)
      stop_cone_half_deg: 20.0   # half-angle of the forward stop cone
      steer_speed_drop: 0.4      # speed loss fraction at full steering lock

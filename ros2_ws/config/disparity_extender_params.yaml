disparity_extender_node:
  ros__parameters:
    # ── Vehicle Geometry (Circle Cast) ──────────────────────────────
    cast_range_min: 0.15        # Min robot half-width at low speed (m) - 21cm width / 2 + 4.5cm margin
    cast_range_max: 0.20        # Max robot half-width at high speed (m) - Dynamic expansion for corners
    cast_precision: 81          # Neighbor window size (indices) for marching
    cast_skip: 4                # Skip factor for coarse FOV scan
    cast_skip_fine: 1           # Skip factor for fine marching neighbors

    # ── Field of View ──────────────────────────────────────────────
    look_range_deg: 80.0        # Forward FOV half-angle (degrees)

    # ── Speed ──────────────────────────────────────────────────────
    max_speed: 1.3            # Maximum linear velocity (m/s)
    speed_cap_corner: 0.8      # Speed cap when cornering (m/s)
    speed_cap_straight: 1.2    # Speed cap on straights (m/s)
    boost_max: 1.155             # Speed boost multiplier on clear straights
    boost_angle_thresh: 10.0     # Max steering angle to allow boost (degrees)
    boost_dist_thresh: 1.5     # Min clear distance to allow boost (m)

    # ── Tower Detection ────────────────────────────────────────────
    edge_slope_thresh: 0.25     # Min LiDAR slope to detect an edge (m)
    tower_width_min: 0.04       # Min physical width to classify as tower (m)
    tower_width_max: 0.10       # Max physical width to classify as tower (m)

    # ── Safety ─────────────────────────────────────────────────────
    danger_dist: 0.30           # Emergency avoidance trigger distance (m) (for 31cm long bot)
    danger_angle_min: 15.0      # Start of side danger zone (degrees)
    danger_angle_max: 90.0      # End of side danger zone (degrees)

    # ── Master Controls ────────────────────────────────────────────
    enable_auto_steering: true  # Set to false to disable scan feed from directing steering/cmd_vel

    # ── Start Gate ─────────────────────────────────────────────────
    require_button_start: true  # Stay in standby until the car's start button is pressed
    start_delay_sec: 3.0        # Delay between the press and the first movement
    button_topic: "/button_status"

    # ── Steering ───────────────────────────────────────────────────
    str_ang_thresh: 60.0        # Max physical steering angle (degrees)

    # ── Game Modes ─────────────────────────────────────────────────
    chase_tower_mode: false     # If true, the bot steers TOWARDS detected towers instead of avoiding them

    # ── Topics ─────────────────────────────────────────────────────
    scan_topic: "/scan"
    odom_topic: "/odom"
    cmd_vel_topic: "/cmd_vel"

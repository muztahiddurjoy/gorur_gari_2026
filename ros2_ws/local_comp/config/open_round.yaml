# ════════════════════════════════════════════════════════════════════
# Open Round Configuration (local_comp)
# ════════════════════════════════════════════════════════════════════

open_round:
  ros__parameters:
    # ── Field of View (degrees) ──
    fov_min_deg: -100.0
    fov_max_deg: 100.0
    max_range: 2.50             # Replacement ceiling for out-of-range rays (m)

    # ── Disparity Extender & Robot Geometry (metres) ──
    car_radius: 0.18            # Vehicle clearance radius (m)
    disparity_thresh: 0.12      # Minimum ray disparity threshold (m)

    # ── Steering & Drive Configuration ──
    wall_safe_dist: 0.35        # Side wall buffer (m)
    speed_straight: 1.2         # Straight path speed (m/s)
    speed_turn: 1.5             # Cornering speed (m/s)
    max_steer_deg: 30.0         # Maximum steering lock in degrees
    target_laps_yaw: 1055.0     # Accumulated yaw threshold for 3 laps (12 corners x 90° - safety reduction)

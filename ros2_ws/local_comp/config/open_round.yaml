# ════════════════════════════════════════════════════════════════════
# Open Round Configuration (local_comp)
# ════════════════════════════════════════════════════════════════════

open_round:
  ros__parameters:
    # ── Field of View & Range (degrees & metres) ──
    fov_min_deg: -100.0
    fov_max_deg: 100.0
    max_range: 2.0             # Replacement for out-of-range/inf rays (m)

    # ── Robot Geometry & Corner Clearance (metres) ──
    car_radius: 0.30            # Vehicle clearance radius for disparity smearing (m)
    disparity_thresh: 0.10      # Minimum ray disparity jump threshold (m)
    wall_safe_dist: 0.35        # Side wall emergency buffer (m)

    # ── Lap & Direction Configuration ──
    start_delay_sec: 5.0        # Pre-run delay after button press (s)
    direction_latch_deg: 35.0   # turn threshold to lock CW or CCW (deg)
    target_laps_yaw: 1065.0     # Yaw threshold for 3 full laps (12 corners x 90° minus exit tol)

    # ── Speed & Throttle Profile (m/s) ──
    # linear.x -> motor: mcu_bridge throttle = x * 100 (throttle_scale),
    # firmware duty = throttle / 127 * 255. 0.40 -> throttle 40 -> PWM 80/255.
    # Below PWM 100 the bot may not start from rest on its own; mcu_bridge's
    # launch boost (x2 for 1 s) gets it rolling, then this keeps it moving.
    speed_straight: 0.40        # Straight speed (m/s) -> PWM 80
    speed_turn: 0.40            # Cornering speed (m/s) -> PWM 80

    # ── Steering & Control Tuning ──
    max_steer_deg: 25.0         # Maximum steering lock in degrees (softened for wide arc)
    steer_alpha: 0.45           # Steering EMA filter factor (0.0 = frozen, 1.0 = original)
    turn_entry_dist: 1.00       # Distance to front wall before triggering corner turn (m)
    center_kp: 1.8              # Proportional gain for straight-line corridor centering
    heading_kp: 0.025           # Steer per degree of IMU heading error on straights
    corner_exit_tol_deg: 15.0   # Exit corner mode within this many deg of 90° target
